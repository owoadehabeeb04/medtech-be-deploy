openapi: 3.0.3
info:
  title: experience_1 Auth + Profile API
  version: 1.0.0
  description: >
    Importable OpenAPI document for the active experience_1 auth, consumer
    profile, and doctor onboarding APIs. Deprecated legacy /user routes and
    appointment routes are intentionally excluded.
servers:
  - url: http://localhost:6200/api/v1/main
    description: Local development
tags:
  - name: Health
  - name: Consumer Auth
  - name: Shared Auth
  - name: Forgot Password
  - name: Consumer Profile
  - name: Doctor Auth
  - name: Doctor Onboarding
paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicEnvelope'
              example:
                message: System is up and running.
                data: {}

  /auth/signup/request-otp:
    post:
      tags: [Consumer Auth]
      summary: Request consumer signup OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsumerSignupRequestOtpRequest'
            example:
              firstName: Ada
              lastName: Stone
              email: consumer1@example.com
              role: consumer
      responses:
        '200':
          description: OTP generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionOtpEnvelope'
              example:
                message: OTP has been sent successfully.
                data:
                  sessionId: ABC123XYZ987
                  otp: '1234'

  /auth/signup/verify-otp:
    post:
      tags: [Consumer Auth]
      summary: Verify consumer signup OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
            example:
              sessionId: ABC123XYZ987
              otp: '1234'
      responses:
        '200':
          description: OTP verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicEnvelope'
              example:
                message: OTP verified successfully.
                data:
                  sessionId: ABC123XYZ987
                  purpose: EMAIL_VERIFICATION

  /auth/signup/resend-otp:
    post:
      tags: [Consumer Auth]
      summary: Resend consumer signup OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionOnlyRequest'
            example:
              sessionId: ABC123XYZ987
      responses:
        '200':
          description: OTP regenerated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionOtpEnvelope'
              example:
                message: OTP has been sent successfully.
                data:
                  sessionId: ABC123XYZ987
                  otp: '5678'

  /auth/signup/complete:
    post:
      tags: [Consumer Auth]
      summary: Complete consumer signup after OTP verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsumerSignupCompleteRequest'
            example:
              sessionId: ABC123XYZ987
              password: StrongPass1!
              confirmPassword: StrongPass1!
      responses:
        '200':
          description: Consumer created and signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessEnvelope'
              example:
                message: Your account has been created successfully.
                data:
                  accessToken: access-token
                  refreshToken: refresh-token
                  user:
                    id: 1
                    email: consumer1@example.com
                    role: consumer
                    firstName: ada
                    lastName: stone
                  profileStatus:
                    onboardingCompleted: false
                    profileCompleted: false
                    nextStep: consumer_username

  /auth/signup/register:
    post:
      tags: [Doctor Auth]
      summary: Register doctor directly
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoctorRegisterRequest'
            example:
              firstName: Tamar
              lastName: Ray
              phoneNumber: '+2348099999999'
              email: doctor1@example.com
              password: StrongPass1!
              confirmPassword: StrongPass1!
              role: doctor
              medicalLicenseNumber: LIC-12345
      responses:
        '200':
          description: Doctor created and signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessEnvelope'
              example:
                message: Your account has been created successfully.
                data:
                  accessToken: access-token
                  refreshToken: refresh-token
                  user:
                    id: 2
                    email: doctor1@example.com
                    role: doctor
                    firstName: tamar
                    lastName: ray
                  profileStatus:
                    onboardingCompleted: false
                    profileCompleted: false
                    nextStep: doctor_profile_image

  /auth/login:
    post:
      tags: [Shared Auth]
      summary: Login consumer or doctor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              consumer:
                value:
                  email: consumer1@example.com
                  password: StrongPass1!
                  role: consumer
              doctor:
                value:
                  email: doctor1@example.com
                  password: StrongPass1!
                  role: doctor
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessEnvelope'
              example:
                message: Login successful.
                data:
                  accessToken: access-token
                  refreshToken: refresh-token
                  user:
                    id: 1
                    email: consumer1@example.com
                    role: consumer
                    firstName: ada
                    lastName: stone
                  profileStatus:
                    onboardingCompleted: false
                    profileCompleted: false
                    nextStep: consumer_username

  /auth/refresh-token:
    post:
      tags: [Shared Auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
            example:
              refreshToken: refresh-token
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessEnvelope'

  /auth/logout:
    post:
      tags: [Shared Auth]
      summary: Logout current user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
            example:
              refreshToken: refresh-token
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicEnvelope'
              example:
                message: Logout successful.

  /auth/me:
    get:
      tags: [Shared Auth]
      summary: Get current authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicEnvelope'
              example:
                message: Success.
                data:
                  user:
                    id: 1
                    email: consumer1@example.com
                    role: consumer
                    firstName: ada
                    lastName: stone
                  profileStatus:
                    onboardingCompleted: false
                    profileCompleted: false
                    nextStep: consumer_username

  /auth/forgot-password/request-otp:
    post:
      tags: [Forgot Password]
      summary: Request forgot-password OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequestOtpRequest'
            example:
              email: consumer1@example.com
      responses:
        '200':
          description: Forgot-password OTP requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionOtpEnvelope'

  /auth/forgot-password/verify-otp:
    post:
      tags: [Forgot Password]
      summary: Verify forgot-password OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
            example:
              sessionId: RST123XYZ456
              otp: '5678'
      responses:
        '200':
          description: Forgot-password OTP verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicEnvelope'
              example:
                message: OTP verified successfully.
                data:
                  sessionId: RST123XYZ456
                  purpose: PASSWORD_RESET

  /auth/forgot-password/resend-otp:
    post:
      tags: [Forgot Password]
      summary: Resend forgot-password OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionOnlyRequest'
            example:
              sessionId: RST123XYZ456
      responses:
        '200':
          description: Forgot-password OTP resent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionOtpEnvelope'

  /auth/reset-password:
    post:
      tags: [Forgot Password]
      summary: Reset password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
            example:
              sessionId: RST123XYZ456
              newPassword: NewStrong1!
              confirmPassword: NewStrong1!
      responses:
        '200':
          description: Password reset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicEnvelope'
              example:
                message: Password reset successful.

  /consumer/profile:
    post:
      tags: [Consumer Profile]
      summary: Create consumer profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsumerProfileRequest'
            example:
              username: ada_user
              phoneNumber: '+2348012345678'
              dateOfBirth: '1998-04-12'
              houseNumber: '12'
              streetName: Allen Avenue
              localGovernmentArea: Ikeja
              state: Lagos
      responses:
        '200':
          description: Consumer profile created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicEnvelope'

    patch:
      tags: [Consumer Profile]
      summary: Update consumer profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsumerProfileUpdateRequest'
            example:
              state: Abuja
      responses:
        '200':
          description: Consumer profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicEnvelope'

    get:
      tags: [Consumer Profile]
      summary: Get consumer profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Consumer profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicEnvelope'

  /consumer/profile/image/upload:
    post:
      tags: [Consumer Profile]
      summary: Upload consumer profile image
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Consumer image uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicEnvelope'

  /consumer/profile/skip:
    post:
      tags: [Consumer Profile]
      summary: Skip consumer profile step
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Consumer step skipped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicEnvelope'

  /doctor/profile/basic:
    post:
      tags: [Doctor Onboarding]
      summary: Create doctor basic profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoctorBasicProfileRequest'
            example:
              firstName: Tamar
              lastName: Ray
              phoneNumber: '+2348099999999'
              medicalLicenseNumber: LIC-12345
              yearsOfExperience: 8
              bio: General practitioner
      responses:
        '200':
          description: Doctor basic profile created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicEnvelope'

    patch:
      tags: [Doctor Onboarding]
      summary: Update doctor basic profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoctorBasicProfileUpdateRequest'
            example:
              bio: Updated doctor bio
      responses:
        '200':
          description: Doctor basic profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicEnvelope'

  /doctor/profile/image:
    post:
      tags: [Doctor Onboarding]
      summary: Upload doctor profile image
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Doctor image uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicEnvelope'

  /doctor/profile/address:
    post:
      tags: [Doctor Onboarding]
      summary: Create doctor address
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoctorAddressRequest'
            example:
              addressLine1: 12 Marina Road
              addressLine2: Suite 4
              city: Lagos
              state: Lagos
      responses:
        '200':
          description: Doctor address saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicEnvelope'

  /doctor/profile/education:
    post:
      tags: [Doctor Onboarding]
      summary: Create doctor education history entry
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoctorEducationRequest'
            example:
              institute: University of Ilorin
              certificate: MBBS
              startDate: '2015-03-12'
              endDate: '2022-07-24'
      responses:
        '200':
          description: Education history created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicEnvelope'

  /doctor/profile/education/{educationId}:
    patch:
      tags: [Doctor Onboarding]
      summary: Update doctor education history entry
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EducationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoctorEducationRequest'
            example:
              institute: University of Ibadan
              certificate: MBBS
              startDate: '2015-03-12'
              endDate: '2022-07-24'
      responses:
        '200':
          description: Education history updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicEnvelope'
    delete:
      tags: [Doctor Onboarding]
      summary: Delete doctor education history entry
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EducationId'
      responses:
        '200':
          description: Education history deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicEnvelope'

  /doctor/profile/work-history:
    post:
      tags: [Doctor Onboarding]
      summary: Create doctor work history entry
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoctorWorkHistoryRequest'
            example:
              company: Hillcrest Hospital
              designation: Medical Officer
              startDate: '2022-07-25'
              endDate: '2024-07-24'
      responses:
        '200':
          description: Work history created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicEnvelope'

  /doctor/profile/work-history/{workId}:
    patch:
      tags: [Doctor Onboarding]
      summary: Update doctor work history entry
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WorkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoctorWorkHistoryRequest'
            example:
              company: Hillcrest Hospital
              designation: Senior Medical Officer
              startDate: '2022-07-25'
              endDate: '2024-07-24'
      responses:
        '200':
          description: Work history updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicEnvelope'
    delete:
      tags: [Doctor Onboarding]
      summary: Delete doctor work history entry
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WorkId'
      responses:
        '200':
          description: Work history deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicEnvelope'

  /doctor/profile/specialties:
    post:
      tags: [Doctor Onboarding]
      summary: Create doctor specialties
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoctorSpecialtiesRequest'
            example:
              specialityIds: [1, 2]
              yearsOfExperience: 8
              bio: General practitioner with telemedicine experience
      responses:
        '200':
          description: Doctor specialties created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicEnvelope'

    patch:
      tags: [Doctor Onboarding]
      summary: Update doctor specialties
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoctorSpecialtiesRequest'
            example:
              specialityIds: [1]
              yearsOfExperience: 10
              bio: Updated doctor bio
      responses:
        '200':
          description: Doctor specialties updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicEnvelope'

  /doctor/profile/complete-onboarding:
    post:
      tags: [Doctor Onboarding]
      summary: Complete doctor onboarding
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Doctor onboarding completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicEnvelope'

  /doctor/profile:
    get:
      tags: [Doctor Onboarding]
      summary: Get doctor profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Doctor profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicEnvelope'
              example:
                message: Doctor profile retrieved successfully
                data:
                  profile:
                    profileImage: https://bucket.s3.region.amazonaws.com/doctor-profile/2/example.jpg
                    phoneNumber: '+2348099999999'
                    medicalLicenseNumber: LIC-12345
                    yearsOfExperience: 8
                    bio: General practitioner
                  educationHistory: []
                  workHistory: []
                  specialties: []
                  profileStatus:
                    onboardingCompleted: false
                    profileCompleted: false
                    nextStep: doctor_education

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    EducationId:
      name: educationId
      in: path
      required: true
      schema:
        type: string
      example: '1'
    WorkId:
      name: workId
      in: path
      required: true
      schema:
        type: string
      example: '1'
  schemas:
    BasicEnvelope:
      type: object
      properties:
        message:
          type: string
        data:
          nullable: true
    SessionOtpEnvelope:
      type: object
      properties:
        message:
          type: string
        data:
          type: object
          properties:
            sessionId:
              type: string
            otp:
              type: string
              nullable: true
    UserSummary:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        role:
          type: string
          enum: [consumer, doctor]
        firstName:
          type: string
        lastName:
          type: string
    ProfileStatus:
      type: object
      properties:
        onboardingCompleted:
          type: boolean
        profileCompleted:
          type: boolean
        nextStep:
          type: string
          nullable: true
    AuthSuccessEnvelope:
      type: object
      properties:
        message:
          type: string
        data:
          type: object
          properties:
            accessToken:
              type: string
            refreshToken:
              type: string
            user:
              $ref: '#/components/schemas/UserSummary'
            profileStatus:
              $ref: '#/components/schemas/ProfileStatus'
    ConsumerSignupRequestOtpRequest:
      type: object
      required: [firstName, lastName, email, role]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [consumer, customer]
    VerifyOtpRequest:
      type: object
      required: [sessionId, otp]
      properties:
        sessionId:
          type: string
        otp:
          type: string
    SessionOnlyRequest:
      type: object
      required: [sessionId]
      properties:
        sessionId:
          type: string
    ConsumerSignupCompleteRequest:
      type: object
      required: [sessionId, password, confirmPassword]
      properties:
        sessionId:
          type: string
        password:
          type: string
        confirmPassword:
          type: string
    DoctorRegisterRequest:
      type: object
      required:
        - firstName
        - lastName
        - phoneNumber
        - email
        - password
        - confirmPassword
        - role
        - medicalLicenseNumber
      properties:
        firstName:
          type: string
        lastName:
          type: string
        phoneNumber:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        confirmPassword:
          type: string
        role:
          type: string
          enum: [doctor, medic]
        medicalLicenseNumber:
          type: string
    LoginRequest:
      type: object
      required: [email, password, role]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        role:
          type: string
          enum: [consumer, doctor]
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    ForgotPasswordRequestOtpRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      required: [sessionId, newPassword, confirmPassword]
      properties:
        sessionId:
          type: string
        newPassword:
          type: string
        confirmPassword:
          type: string
    ConsumerProfileRequest:
      type: object
      required:
        - username
        - phoneNumber
        - dateOfBirth
        - houseNumber
        - streetName
        - localGovernmentArea
        - state
      properties:
        username:
          type: string
        phoneNumber:
          type: string
        dateOfBirth:
          type: string
          format: date
        houseNumber:
          type: string
        streetName:
          type: string
        localGovernmentArea:
          type: string
        state:
          type: string
    ConsumerProfileUpdateRequest:
      type: object
      properties:
        username:
          type: string
        phoneNumber:
          type: string
        dateOfBirth:
          type: string
          format: date
        houseNumber:
          type: string
        streetName:
          type: string
        localGovernmentArea:
          type: string
        state:
          type: string
    DoctorBasicProfileRequest:
      type: object
      required:
        - firstName
        - lastName
        - phoneNumber
        - medicalLicenseNumber
        - yearsOfExperience
        - bio
      properties:
        firstName:
          type: string
        lastName:
          type: string
        phoneNumber:
          type: string
        medicalLicenseNumber:
          type: string
        yearsOfExperience:
          type: integer
        bio:
          type: string
    DoctorBasicProfileUpdateRequest:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        phoneNumber:
          type: string
        medicalLicenseNumber:
          type: string
        yearsOfExperience:
          type: integer
        bio:
          type: string
    DoctorAddressRequest:
      type: object
      required: [addressLine1, city, state]
      properties:
        addressLine1:
          type: string
        addressLine2:
          type: string
          nullable: true
        city:
          type: string
        state:
          type: string
    DoctorEducationRequest:
      type: object
      required: [institute, certificate, startDate]
      properties:
        institute:
          type: string
        certificate:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true
    DoctorWorkHistoryRequest:
      type: object
      required: [company, designation, startDate]
